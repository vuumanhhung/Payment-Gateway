version: '3'
volumes:
  redis-data:
    driver: local
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./config/config.yml:/app/config/config.yml
      - ./.browser-data:/app/.browser-data
      - ./.admin-data:/app/.admin-data
    stdin_open: true
    tty: true
    ports:
      - ${PORT}:${PORT}
    depends_on:
      - redis
      - captcha-resolver
    environment:
      - PORT=${PORT}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CAPTCHA_API_BASE_URL=http://captcha-resolver:1234
      - ACB_MANUAL_LOGIN=${ACB_MANUAL_LOGIN:-false}
      - ACB_SAFEKEY_CONSOLE=${ACB_SAFEKEY_CONSOLE:-false}
      - GATEWAY_AUTO_CRON=${GATEWAY_AUTO_CRON:-false}
      - GATEWAY_PRELOGIN=${GATEWAY_PRELOGIN:-true}
      - TECHCOMBANK_HEADLESS=${TECHCOMBANK_HEADLESS:-false}
      - TECHCOMBANK_LOGIN_TIMEOUT_MS=${TECHCOMBANK_LOGIN_TIMEOUT_MS:-300000}
      - PAYMENT_CHECK_TIMEOUT_SEC=${PAYMENT_CHECK_TIMEOUT_SEC:-30}
      - PAYMENT_CHECK_INTERVAL_SEC=${PAYMENT_CHECK_INTERVAL_SEC:-15}
      - PAYMENT_CHECK_MAX_ATTEMPTS=${PAYMENT_CHECK_MAX_ATTEMPTS:-2}
  redis:
    image: redis:6.2-alpine
    volumes:
      - redis-data:/data
  captcha-resolver:
    image: registry.gitlab.com/nhayhoc/bank-captcha-server
