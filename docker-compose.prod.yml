version: '3'
volumes:
  redis-data:
    driver: local
services:
  app:
    image: registry.gitlab.com/nhayhoc/payment-service
    volumes:
      - ./config/config.yml:/app/config/config.yml
    ports:
      - ${PORT}:${PORT}
    depends_on:
      - redis
      - captcha-resolver
    environment:
      - PORT=${PORT}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CAPTCHA_API_BASE_URL=http://captcha-resolver:1234
      - GATEWAY_AUTO_CRON=${GATEWAY_AUTO_CRON:-false}
      - GATEWAY_PRELOGIN=${GATEWAY_PRELOGIN:-true}
      - TECHCOMBANK_HEADLESS=${TECHCOMBANK_HEADLESS:-true}
      - TECHCOMBANK_LOGIN_TIMEOUT_MS=${TECHCOMBANK_LOGIN_TIMEOUT_MS:-300000}
  redis:
    image: redis:6.2-alpine
    volumes:
      - redis-data:/data
  captcha-resolver:
    image: registry.gitlab.com/nhayhoc/bank-captcha-server
